site_name: CTP Common
site_description: NYU Abu Dhabi — Core Technology Platforms — single source of truth
site_url: https://nyuad-ctp.github.io/ctp-common/   # adjust to your GitHub Pages URL
repo_url: https://github.com/nyuad-ctp/ctp-common   # adjust to your repo URL
repo_name: ctp-common
edit_uri: edit/main/

# Source markdown lives at the repo root (for downstream consumers).
# A pre-build hook copies it into ./docs so MkDocs sees the conventional layout.
docs_dir: docs
site_dir: site

# Hooks run on every build, including `mkdocs serve` rebuilds.
hooks:
  - hooks/prepare_docs.py

# `mkdocs serve` only watches docs_dir by default. Tell it to also watch the
# source paths so edits at the repo root trigger a rebuild.
watch:
  - README.md
  - AGENTS.md
  - team.md
  - links.md
  - platforms
  - operations
  - data
  - examples
  - hooks

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - macros:
      # YAML paths are relative to mkdocs.yml (repo root).
      include_yaml:
        - data/people.yaml
        - data/links.yaml

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Nav paths are relative to docs_dir (which is populated by the hook above).
nav:
  - Home: index.md
  - Team: team.md
  - Platforms:
    - Overview: platforms/index.md
    - Analytical & Materials Characterization: platforms/analytical-materials-characterization.md
    - Spectrometry & Spectroscopy: platforms/spectrometry-spectroscopy.md
    - Microfabrication: platforms/microfabrication.md
    - Molecular & Cell Biology: platforms/molecular-cell-biology.md
    - Sequencing: platforms/sequencing.md
    - High-Throughput Screening: platforms/high-throughput-screening.md
    - Light Microscopy: platforms/light-microscopy.md
    - Brain Imaging: platforms/brain-imaging.md
    - Marine Biology: platforms/marine-biology.md
    - Advanced Manufacturing & Electronics: platforms/advanced-manufacturing-electronics.md
    - Photonics: platforms/photonics.md
    - Kinesis: platforms/kinesis.md
    - Veterinary Facility: platforms/veterinary-facility.md
  - Operations:
    - Scheduling: operations/scheduling.md
    - Procurement: operations/procurement.md
  - Public links: links.md
  - For agents: AGENTS.md
